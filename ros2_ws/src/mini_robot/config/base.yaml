mini_serial_bridge:
  ros__parameters:
    port: /dev/arduino_mini
    baud: 500000
    cmd_vel_topic: /cmd_vel_out
    odom_topic: /odom
    imu_topic: /imu/data
    odom_frame: odom
    base_frame: base_footprint
    imu_frame: imu_link
    publish_odom_tf: true
    command_rate_hz: 20.0
    # Mirrors MAX_LINEAR_MM_S / MAX_ANGULAR_DEG_S in
    # arduino_mini_base_controller/Config.h. Change both together.
    max_linear_m_s: 0.15
    max_angular_rad_s: 1.5
    wheel_diameter_m: 0.047
    # Must match MEASURED_COUNTS_PER_REV in arduino_mini_base_controller.ino.
    # Only affects the wheel angles in /joint_states (RViz animation), not
    # odometry, which the Arduino integrates itself.
    counts_per_rev: 520.0
    # The LiDAR faces the caster end, so that end is the robot's front while
    # the Arduino still calls the drive-axle end forward. True rotates every
    # x/y quantity crossing the serial link by 180 deg, so a positive
    # cmd_vel linear.x drives towards the LiDAR. Change this together with
    # caster_x / imu_joint in mini_robot.urdf.xacro and the costmap footprint
    # in nav2_params.yaml -- they describe the same physical decision.
    reverse_base_direction: true

mini_cmd_mux:
  ros__parameters:
    front_stop_distance: 0.30
    front_half_angle_deg: 45.0
    source_timeout: 0.40
